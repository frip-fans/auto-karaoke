[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-karaoke"
version = "0.1.0"
description = "Local Japanese karaoke prototype with furigana and replaceable audio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "soundfile>=0.12,<1", "av>=13,<19", "pykakasi>=2.3,<3"]

[project.optional-dependencies]
align = ["torch>=2.5,<3", "transformers>=4.48,<6", "scipy>=1.13,<2"]
transcribe = ["faster-whisper>=1.1,<2"]
separate = ["audio-separator==0.47.0", "onnxruntime>=1.20,<2"]

[project.scripts]
auto-karaoke = "auto_karaoke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
